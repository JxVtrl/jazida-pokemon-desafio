version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: jazida-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jazida
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: jazida-backend
    volumes:
      - ./backend:/app
    ports:
      - "4001:4001"
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: jazida
      DB_PORT: 5432
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: jazida-frontend
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      PORT: 5173

volumes:
  db_data:
